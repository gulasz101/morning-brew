# Pipeline configuration for the Morning Brew builder.
# No secrets here. Every credential comes from the environment.

[writer]
# The owner picked this blind on 2026-10-29 (GUL-520, set-2). It is a reasoning model, so
# it needs the answer room and the shorter input window in [writer.limits."beam-free-go"].
model = "beam-free-go"
base_url = "https://llm.voitech.dev/v1"
api_key_env = "BREW_LLM_API_KEY"
parallel = 4
retries = 1
# A second, narrow writer call per item whose only job is the project line. The main call
# writes four fields at once and lands on "nothing for my projects" by default; this pass
# sees the finished item plus the project inventory and decides the fit on its own.
project_pass = true
# Cloudflare in front of llm.voitech.dev cuts a request at ~100 s with HTTP 524. Stop
# 5 s earlier so a slow model is a retryable ModelError, not a hang on the edge.
timeout_sec = 95
# The answer ceiling for a model without an entry in [writer.limits.<model>].
max_tokens = 2000

# Per-model overrides of the answer ceiling and the input window. The defaults come
# from [limits] (26000 chars of transcript, 14000 of article) and suit a fast model:
# deepseek-v4.1-flash-ollama answers a 26k-char transcript in ~11 s. A reasoning model
# needs a shorter window and more answer room. A model with no entry here that cannot
# answer inside 95 s is not a writer - see README, "The 100 s edge".
[writer.limits."beam-free-go"]
# 8000 is measured on the 2026-10-27 replay: at 4000 two of 46 items died on
# finish_reason=length with 3.6k-4k reasoning tokens; 8000 wrote all 46 in 214 s.
max_tokens = 8000
article_chars = 10000
transcript_chars = 14000

[karakeep]
api_key_env = "KARAKEEP_API_KEY"
server_env = "KARAKEEP_SERVER_ADDR"

[paths]
vault_root = "~/wojtek.second.brain.obsidian.vault"
blog_repo = "~/Projects/morning-brew"
skill_md = "~/.hermes/skills/research/karakeep-hoard-digest/SKILL.md"
processor = "~/.hermes/scripts/karakeep_digest.py"
enrich = "~/.hermes/skills/research/karakeep-hoard-digest/scripts/karakeep_enrich.py"

[projects]
# The only project names the writer may put in "ideas". Every name here must have a
# paragraph in prompts/projects.md: the validator rejects a project it does not know, and
# a project with no paragraph gives the writer nothing to match against.
allowed = ["riffradar", "homelab-2nd", "ideogram4-local", "code-factory", "agent-fleet",
           "morning-brew"]

# Parts of each project an idea may touch. The validator rejects an idea that names none of
# its project's tokens, so the writer has to say which service or stage it would change
# instead of writing "my homelab" and stopping there. Keep the tokens as lowercase words or
# short phrases that appear in prompts/projects.md.
[projects.components]
riffradar = ["riff", "guitar", "practice", "song"]
homelab-2nd = ["k3s", "kubernetes", "flux", "omv", "minio", "cloudnativepg", "postgres",
               "sops", "pihole", "pi-hole", "karakeep", "nextcloud", "arr-stack", "arr-box",
               "sonarr", "radarr", "prowlarr", "bazarr", "qbittorrent", "mattermost",
               "opengist", "shlink", "excalidraw", "whiteboard", "node-red", "zigbee",
               "influxdb", "speaches", "voicebox", "hindsight", "docs-mcp", "llm-hub",
               "litellm", "ollama", "paperclip", "status page", "host-watch", "firecrawl",
               "mail-archiver", "tunnel", "backup", "monitoring", "alerting", "metrics",
               "sso", "oauth2-proxy"]
ideogram4-local = ["comfyui", "stable diffusion", "image", "m1 max", "unified memory",
                   "image studio", "matejko", "lora", "vram", "gpu"]
code-factory = ["code factory", "adr-093", "tester", "builder", "reviewer", "verifier",
                "check", "pull request", "merge", "ci", "test", "sandbox", "skill"]
agent-fleet = ["hermes", "hindsight", "docs-mcp", "paperclip", "gateway", "m1 air", "agent",
               "skill", "memory", "model", "mattermost", "email", "approval", "tool"]
morning-brew = ["karakeep", "parakeet", "marmite", "writer", "blog", "github pages", "llm",
                "cloudflare", "transcript", "pipeline", "bookmark"]

[limits]
# The skill used to be one 131k-character prompt. Warn when it grows again.
skill_md_max_lines = 250
article_chars = 14000
transcript_chars = 26000
# Fail the run when more than this share of items is dropped.
max_drop_ratio = 0.10

[live]
base = "https://gulasz101.github.io/morning-brew"
