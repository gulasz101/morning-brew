# Pipeline configuration for the Morning Brew builder.
# No secrets here. Every credential comes from the environment.

[writer]
model = "deepseek-v4.1-flash-ollama"
base_url = "https://llm.voitech.dev/v1"
api_key_env = "BREW_LLM_API_KEY"
parallel = 4
retries = 1
# Cloudflare in front of llm.voitech.dev cuts a request at ~100 s with HTTP 524. Stop
# 5 s earlier so a slow model is a retryable ModelError, not a hang on the edge.
timeout_sec = 95
# The answer ceiling for a model without an entry in [writer.limits.<model>].
max_tokens = 2000

# Per-model overrides of the answer ceiling and the input window. The defaults come
# from [limits] (26000 chars of transcript, 14000 of article) and suit a fast model:
# deepseek-v4.1-flash-ollama answers a 26k-char transcript in ~11 s. A reasoning model
# needs a shorter window and more answer room. A model with no entry here that cannot
# answer inside 95 s is not a writer - see README, "The 100 s edge".
[writer.limits."beam-free-go"]
max_tokens = 4000
article_chars = 10000
transcript_chars = 14000

[karakeep]
api_key_env = "KARAKEEP_API_KEY"
server_env = "KARAKEEP_SERVER_ADDR"

[paths]
vault_root = "~/wojtek.second.brain.obsidian.vault"
blog_repo = "~/Projects/morning-brew"
skill_md = "~/.hermes/skills/research/karakeep-hoard-digest/SKILL.md"
processor = "~/.hermes/scripts/karakeep_digest.py"
enrich = "~/.hermes/skills/research/karakeep-hoard-digest/scripts/karakeep_enrich.py"

[projects]
# The only project names the writer may put in "ideas".
allowed = ["riffradar", "homelab-2nd", "ideogram4-local"]

[limits]
# The skill used to be one 131k-character prompt. Warn when it grows again.
skill_md_max_lines = 250
article_chars = 14000
transcript_chars = 26000
# Fail the run when more than this share of items is dropped.
max_drop_ratio = 0.10

[live]
base = "https://gulasz101.github.io/morning-brew"
